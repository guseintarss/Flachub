services:
  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: pageglow-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - pageglow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # Django Application
  # ===========================================
  pageglow:
    build:
      context: ./PageGlow
      dockerfile: Dockerfile
    image: pageglow:latest
    container_name: pageglow-app
    restart: always
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput --clear &&
      daphne -b 0.0.0.0 -p 8000 PageGlow.asgi:application
      "
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_HOST=postgres-test
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
      - REDIS_URL=redis://redis:6379/0
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - META_SITE_DOMAIN=${META_SITE_DOMAIN:-localhost}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ./frontend/build:/frontend/build:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pageglow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: pageglow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pageglow.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:rw
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - logs_volume:/app/logs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - pageglow
    networks:
      - pageglow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # Certbot (SSL Certificates)
  # ===========================================
  certbot:
    image: certbot/certbot
    container_name: pageglow-certbot
    volumes:
      - ./nginx/certbot:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - pageglow-network
    profiles:
      - tools

  # ===========================================
  # PostgreSQL Test Database
  # ===========================================
  postgres-test:
    image: postgres:16-alpine
    container_name: pageglow-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DATABASE_NAME:-pageglow_test}
      POSTGRES_USER: ${TEST_DATABASE_USERNAME:-pageglow_test}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:-pageglow_test_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - pageglow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DATABASE_USERNAME:-pageglow_test} -d ${TEST_DATABASE_NAME:-pageglow_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - test

  # ===========================================
  # Adminer (Database Admin - Optional)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: pageglow-adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=${DATABASE_HOST}
    networks:
      - pageglow-network
    profiles:
      - tools

# ===========================================
# Volumes
# ===========================================
volumes:
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  nginx_logs:
    driver: local
  postgres_test_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  pageglow-network:
    driver: bridge
