# Nginx конфигурация для PageGlow (ФлакХаб)
# Production конфигурация с HTTPS, оптимизацией и SEO

# Upstream для Django приложения
upstream pageglow_app {
    server pageglow:8000 fail_timeout=30s max_fails=3;
    keepalive 32;
}

# HTTP сервер — редирект на HTTPS
server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 75M;

    # Логирование
    access_log /var/log/nginx/pageglow_access.log combined;
    error_log /var/log/nginx/pageglow_error.log warn;

    # Для Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://pageglow_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Редирект всех HTTP запросов на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name _;
    charset utf-8;
    client_max_body_size 75M;

    # SSL сертификаты
    ssl_certificate /etc/nginx/ssl/flachub-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/flachub-privkey.pem;

    # ===== SSL оптимизация =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===== Gzip сжатие (SEO: скорость загрузки) =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/atom+xml
        application/geo+json
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon;

    # ===== Brotli сжатие (если модуль установлен) =====
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/atom+xml application/ld+json image/svg+xml;

    # ===== Security Headers (SEO: безопасность влияет на ранжирование) =====
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Логирование
    access_log /var/log/nginx/pageglow_access.log combined;
    error_log /var/log/nginx/pageglow_error.log warn;

    # Health check endpoint
    location /health/ {
        proxy_pass http://pageglow_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Статика (кэширование на 30 дней)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Медиа файлы (кэширование на 7 дней)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Проксирование на Django
    location / {
        proxy_pass http://pageglow_app;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Буферы
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Защита от доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Защита от скачивания бэкапов
    location ~* \.(sql|gz|zip|tar|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== Custom Error Pages (Static) =====
    # Эти страницы показываются, когда Django/Gunicorn недоступен
    
    error_page 502 /502.html;
    error_page 503 /503.html;
    error_page 504 /504.html;

    location = /502.html {
        root /app/static/errors;
        internal;
    }

    location = /503.html {
        root /app/static/errors;
        internal;
    }

    location = /504.html {
        root /app/static/errors;
        internal;
    }
}
