# Nginx конфигурация для PageGlow
# Production конфигурация с HTTPS и оптимизацией
# Если SSL сертификатов нет — работает на HTTP

# Upstream для Django приложения
upstream pageglow_app {
    server pageglow:8000 fail_timeout=30s max_fails=3;
    keepalive 32;
}

# HTTP сервер
server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 75M;

    # Логирование
    access_log /var/log/nginx/pageglow_access.log combined;
    error_log /var/log/nginx/pageglow_error.log warn;

    # Для Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://pageglow_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Статика (кэширование)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Медиа файлы
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Проксирование на Django
    location / {
        proxy_pass http://pageglow_app;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Буферы
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Защита от доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Защита от скачивания бэкапов
    location ~* \.(sql|gz|zip|tar|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS сервер (только если сертификаты существуют)
# Nginx не запустится если файлы ssl_certificate/ssl_certificate_key не найдены
# Поэтому этот блок включается условно через include
# Для активации HTTPS: скопируйте nginx/ssl-enabled.conf в nginx/conf.d/
