name: PageGlow CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Сервисы для тестов
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pageglow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r PageGlow/requirements.txt
        pip install flake8 black isort

    - name: Lint with flake8
      run: |
        # Останавливаем сборку только на критических ошибках
        flake8 PageGlow/ --exclude=migrations,__pycache__,static --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 PageGlow/ --exclude=migrations,__pycache__,static --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code style with black
      run: |
        black PageGlow/ --check --exclude=migrations || true

    - name: Check imports with isort
      run: |
        isort PageGlow/ --check-only --skip=migrations || true

    - name: Run tests with pytest
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/pageglow_test
        REDIS_URL: redis://localhost:6379/0
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        pytest \
          --cov=PageGlow \
          --cov-report=xml \
          --cov-report=term-missing \
          --junitxml=pytest-junit.xml \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-python${{ matrix.python-version }}
        path: |
          pytest-junit.xml
          coverage.xml

  security-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install safety
      run: pip install safety

    - name: Check dependencies for vulnerabilities
      run: |
        safety check -r PageGlow/requirements.txt || true

  build-check:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f PageGlow/Dockerfile -t pageglow:${{ github.sha }} .
