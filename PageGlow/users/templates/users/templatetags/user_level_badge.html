{% load static %}
{% if level %}
    <span class="user-level-badge" 
          style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: linear-gradient(135deg, {{ level.color }}25 0%, {{ level.color }}10 100%); border: 1px solid {{ level.color }}40; border-radius: 20px; font-size: 0.85rem;">
        <span class="level-icon" style="font-size: 1rem;">{{ level.icon }}</span>
        <span class="level-name" style="color: {{ level.color }}; font-weight: 500; white-space: nowrap;">{{ level.name }}</span>
    </span>
{% else %}
    <span class="user-level-badge" 
          style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(153, 153, 153, 0.15); border: 1px solid rgba(153, 153, 153, 0.3); border-radius: 20px; font-size: 0.85rem;">
        <span class="level-icon" style="font-size: 1rem;">🌱</span>
        <span class="level-name" style="color: #999; font-weight: 500; white-space: nowrap;">Новичок</span>
    </span>
{% endif %}
