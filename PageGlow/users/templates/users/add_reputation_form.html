{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="add-reputation-form" style="max-width: 500px; margin: 0 auto;">
    <h1 class="page-title">{{ title }}</h1>
    
    <div class="card" style="background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px;">
        <div style="margin-bottom: 20px;">
            <strong>Пользователь:</strong> {{ target_user.username }}
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3" style="margin-bottom: 20px;">
                <label for="amount" class="form-label">Сумма изменения</label>
                <input type="number" name="amount" id="amount" class="form-control" 
                       required min="-1000" max="1000" placeholder="Например: 50 или -20">
                <small class="form-text text-muted">
                    Положительное значение — награда, отрицательное — штраф
                </small>
            </div>
            
            <div class="mb-3" style="margin-bottom: 20px;">
                <label for="reason" class="form-label">Причина</label>
                <select name="reason" id="reason" class="form-control" required>
                    <option value="manual">Ручное изменение</option>
                    <option value="post_created">Публикация поста</option>
                    <option value="comment_created">Создание комментария</option>
                    <option value="penalty">Нарушение правил</option>
                </select>
            </div>
            
            <div class="mb-3" style="margin-bottom: 20px;">
                <label for="comment" class="form-label">Комментарий (опционально)</label>
                <textarea name="comment" id="comment" class="form-control" rows="3" 
                          placeholder="Пояснение к изменению репутации"></textarea>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Применить</button>
                <a href="{% url 'users:reputation_history' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
