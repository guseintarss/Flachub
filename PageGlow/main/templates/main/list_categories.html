
{% for cat in cats %}
  {% if cat.id == cat_selected %}
    <a class="menu_link" href="{{ cat.get_absolute_url }}" style="background: var(--primary); color: white;">
      <i class="fas fa-folder-open"></i> {{ cat.name }}
    </a>
  {% else %}
    <a class="menu_link" href="{{ cat.get_absolute_url }}">
      <i class="fas fa-folder"></i> {{ cat.name }}
    </a>
  {% endif %}
{% endfor %}
