{% load static %}
{% for cat in cats %}
<div class="menu-category-item">
  <a class="menu_link menu_link-category{% if cat.id == cat_selected %} is-active{% endif %}"
     href="{{ cat.get_absolute_url }}">
    <span class="menu-link-content">
      <i class="fas fa-folder{% if cat.id == cat_selected %}-open{% endif %}"></i>
      {{ cat.name }}
    </span>
    <span class="category-count">{{ cat.posts_count|default:0 }}</span>
  </a>
</div>
{% endfor %}
