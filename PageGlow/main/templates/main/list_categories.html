
{% for cat in cats %}
  {% if cat.id == cat_selected %}
    <a class="menu_link menu_link-category" href="{{ cat.get_absolute_url }}" style="background: var(--primary); color: white;">
      <span class="menu-link-content">
        <i class="fas fa-folder-open"></i> {{ cat.name }}
      </span>
      <span class="category-count">{{ cat.posts_count|default:0 }}</span>
    </a>
  {% else %}
    <a class="menu_link menu_link-category" href="{{ cat.get_absolute_url }}">
      <span class="menu-link-content">
        <i class="fas fa-folder"></i> {{ cat.name }}
      </span>
      <span class="category-count">{{ cat.posts_count|default:0 }}</span>
    </a>
  {% endif %}
{% endfor %}
