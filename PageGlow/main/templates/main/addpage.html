{% extends 'base.html' %}
{% block content %}
<div class="post">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label for="{{ form.content.id_for_label }}">Содержание:</label>
        {{ form.content }}
    </div>
    <h3 class="tagOptions">Общие настройки</h3>
    <div class="form-grid">
            <label for="{{form.cat.id_for_label}}">Категория:</label>
            {{form.cat}}
            <label for="{{form.is_published.id_for_label}}">Статус:</label>
            {{form.is_published}}
            <label for="{{form.photo.id_for_label}}">Обложка:</label>
            {{form.photo}}
    </div>

  <!-- Контейнер для выбранных тегов -->
  <div class="selected-tags-container">
      <label>Выбранные теги:</label>
      <div class="selected-tags" id="selectedTags"></div>
  </div>

  <div class="available-skills">
      <label>Выберите навыки:</label>
      <div class="tags-grid" id="tagsGrid">
          {% for tag in form.tags.field.queryset %}
          <div class="tag-wrapper" data-tag-id="{{ tag.id }}">
              <input 
              type="checkbox" 
              name="tags"
              value="{{ tag.id }}"
              id="tag-{{ tag.id }}" 
              data-tag-id="{{ tag.id }}" 
              data-tag-name="{{ tag.tag }}"
              >
              <label 
              for="tag-{{ tag.id }}" 
              class="tag-option"
              >
              {{ tag.tag }}
              </label>
          </div>
          {% endfor %}
      </div>
  </div>

  <button type="submit" class="mt-4 btn btn-primary">Сохранить</button>
</form>
</div>

{% endblock %}

{% block extra_js %}
{{ form.media }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const selectedTags = document.getElementById('selectedTags');
  const tagsGrid = document.getElementById('tagsGrid');
  const checkboxes = tagsGrid.querySelectorAll('input[type="checkbox"]');
  

  const selectedTagIds = new Set();


  checkboxes.forEach(checkbox => {
    checkbox.addEventListener('change', function() {
      const tagId = this.getAttribute('data-tag-id');
      const tagName = this.getAttribute('data-tag-name');

      if (this.checked && !isNaN(tagId)) {
        selectedTagIds.add(tagId);
        addSelectedTag(tagId, tagName);
        hideOriginalTag(tagId); // Скрываем исходный тег
      } else {
        selectedTagIds.delete(tagId);
        removeSelectedTag(tagId);
        showOriginalTag(tagId); // Показываем исходный тег снова
      }

    });
  });

  function addSelectedTag(id, name) {
    const tagElement = document.createElement('span');
    tagElement.className = 'tag-selected';
    tagElement.setAttribute('data-id', id);
    tagElement.innerHTML = `
      ${name}
      <span class="tag-remove" data-id="${id}">×</span>
    `;
    selectedTags.appendChild(tagElement);

    tagElement.querySelector('.tag-remove').addEventListener('click', function(e) {
      e.stopPropagation();
      removeSelectedTag(id);
      showOriginalTag(id);
      checkboxes.forEach(cb => {
        if (cb.getAttribute('data-tag-id') === id) cb.checked = false;
      });
    });
  }

  function removeSelectedTag(id) {
    const tagElement = selectedTags.querySelector(`[data-id="${id}"]`);
    if (tagElement) tagElement.remove();
  }


function hideOriginalTag(id) {
  const originalWrapper = tagsGrid.querySelector(`.tag-wrapper[data-tag-id="${id}"]`);
  if (originalWrapper) {
    originalWrapper.style.display = 'none'; // Скрываем весь контейнер навыка
  }
}


function showOriginalTag(id) {
  const originalWrapper = tagsGrid.querySelector(`.tag-wrapper[data-tag-id="${id}"]`);
  if (originalWrapper) {
    originalWrapper.style.display = 'flex'; // Возвращаем видимость (зависит от ваших стилей)
  }
}
});


</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function toggleCKEditorTheme() {
        const editorElement = document.querySelector('.ck');
        if (editorElement) {
            if (document.documentElement.classList.contains('dark-mode')) {
                editorElement.classList.add('dark-mode');
            } else {
                editorElement.classList.remove('dark-mode');
            }
        }
    }

    setTimeout(toggleCKEditorTheme, 500);

    window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', toggleCKEditorTheme);
});
</script>
{% endblock %}
