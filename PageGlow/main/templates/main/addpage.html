{% extends 'base.html' %}
{% block content %}
<div class="post">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label for="{{ form.content.id_for_label }}">Содержание:</label>
        {{ form.content }}
    </div>
    <h3 class="tagOptions">Общие настройки</h3>
    <div class="form-grid">
        <!-- <div class="category"> -->
            <label for="{{form.cat.id_for_label}}">Категория:</label>
            {{form.cat}}
        <!-- </div> -->
        <!-- <div class="status"> -->
            <label for="{{form.is_published.id_for_label}}">Статус:</label>
            {{form.is_published}}
        <!-- </div> -->
    </div>
  <!-- Контейнер для выбранных тегов -->
  <div class="selected-tags-container">
    <label>Выбранные теги:</label>
    <div class="selected-tags" id="selectedTags"></div>
  </div>

  <!-- Список доступных тегов из БД -->
  <div class="available-tags">
    <label>Выберите теги:</label>
    <div class="tags-grid" id="tagsGrid">
      {% for tag in form.tags.field.queryset %}
        <span
          class="tag-option"
          data-tag-id="{{ tag.id }}"
          data-tag-name="{{ tag.tag }}"
        >
          {{ tag.tag }}
        </span>
      {% endfor %}
    </div> 
  </div>

  <button type="submit" class="submit-btn">Сохранить</button>
</form>
</div>

{% endblock %}

{% block extra_js %}
{{ form.media }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const selectedTags = document.getElementById('selectedTags');
  const tagsGrid = document.getElementById('tagsGrid');
  const tagOptions = tagsGrid.querySelectorAll('.tag-option');
  const hiddenInput = document.createElement('input');
  hiddenInput.type = 'hidden';
  hiddenInput.name = 'selected_tags';
  document.querySelector('form').appendChild(hiddenInput);

  // Хранилище выбранных тегов
  const selectedTagIds = new Set();

  // Обработчик клика по тегу
  tagOptions.forEach(tag => {
    tag.addEventListener('click', function() {
      const tagId = this.getAttribute('data-tag-id');
      const tagName = this.getAttribute('data-tag-name');

      if (selectedTagIds.has(tagId)) {
        // Удаляем тег
        selectedTagIds.delete(tagId);
        this.classList.remove('selected');
        const tagElement = selectedTags.querySelector(`[data-id="${tagId}"]`);
        if (tagElement) tagElement.remove();
      } else {
        // Добавляем тег
        selectedTagIds.add(tagId);
        this.classList.add('selected');

        // Создаём элемент выбранного тега
        const tagElement = document.createElement('span');
        tagElement.className = 'tag-selected';
        tagElement.setAttribute('data-id', tagId);

        tagElement.innerHTML = `
          ${tagName}
          <span class="tag-remove" data-id="${tagId}">×</span>
        `;

        selectedTags.appendChild(tagElement);

        // Обработчик удаления тега
        tagElement.querySelector('.tag-remove').addEventListener('click', function(e) {
          e.stopPropagation();
          const removeId = this.getAttribute('data-id');
          selectedTagIds.delete(removeId);
          this.parentElement.remove();
          const tagOption = tagsGrid.querySelector(`[data-tag-id="${removeId}"]`);
          if (tagOption) tagOption.classList.remove('selected');
        });
      }

      // Обновляем скрытое поле с ID тегов
      hiddenInput.value = Array.from(selectedTagIds).join(',');
    });
  });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function toggleCKEditorTheme() {
        const editorElement = document.querySelector('.ck');
        if (editorElement) {
            if (document.documentElement.classList.contains('dark-mode')) {
                editorElement.classList.add('dark-mode');
            } else {
                editorElement.classList.remove('dark-mode');
            }
        }
    }
    
    setTimeout(toggleCKEditorTheme, 500);
    
    window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', toggleCKEditorTheme);
});
</script>
{% endblock %}
