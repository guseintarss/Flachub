{% load static %}

{# Шаблон для красивого отображения выбора навыков #}

<div class="mb-4">
    <label class="form-label fw-bold">
        <i class="fas fa-hammer"></i> {{ label | default:"Навыки" }}
    </label>
    
    {% if help_text %}
        <small class="d-block mb-2 text-muted">{{ help_text }}</small>
    {% endif %}

    <div class="skills-selector">
        {% for field in form_field %}
            <div class="skill-checkbox-wrapper">
                {{ field.tag }}
                <label for="{{ field.id_for_label }}" class="skill-checkbox-label">
                    {% if field.choice_label %}
                        {% if field.choice_label == 'Python' %}
                            <i class="fab fa-python skill-icon"></i>
                        {% elif field.choice_label == 'JavaScript' %}
                            <i class="fab fa-js skill-icon"></i>
                        {% elif field.choice_label == 'TypeScript' %}
                            <i class="fab fa-js-square skill-icon"></i>
                        {% elif field.choice_label == 'PHP' %}
                            <i class="fab fa-php skill-icon"></i>
                        {% elif field.choice_label == 'Java' %}
                            <i class="fab fa-java skill-icon"></i>
                        {% elif field.choice_label == 'Docker' %}
                            <i class="fab fa-docker skill-icon"></i>
                        {% elif field.choice_label == 'React' %}
                            <i class="fab fa-react skill-icon"></i>
                        {% elif field.choice_label == 'Vue.js' %}
                            <i class="fab fa-vuejs skill-icon"></i>
                        {% elif field.choice_label == 'Angular' %}
                            <i class="fab fa-angular skill-icon"></i>
                        {% elif field.choice_label == 'Django' %}
                            <i class="fab fa-python skill-icon"></i>
                        {% elif field.choice_label == 'AWS' %}
                            <i class="fab fa-aws skill-icon"></i>
                        {% elif field.choice_label == 'Git' %}
                            <i class="fab fa-git skill-icon"></i>
                        {% elif field.choice_label == 'PostgreSQL' %}
                            <i class="fas fa-database skill-icon"></i>
                        {% elif field.choice_label == 'MongoDB' %}
                            <i class="fas fa-database skill-icon"></i>
                        {% elif field.choice_label == 'Linux' %}
                            <i class="fab fa-linux skill-icon"></i>
                        {% elif field.choice_label == 'UI Design' %}
                            <i class="fas fa-palette skill-icon"></i>
                        {% elif field.choice_label == 'UX Design' %}
                            <i class="fas fa-users skill-icon"></i>
                        {% else %}
                            <i class="fas fa-code skill-icon"></i>
                        {% endif %}
                        <span>{{ field.choice_label }}</span>
                    {% endif %}
                </label>
            </div>
        {% endfor %}
    </div>

    {% if form_field.errors %}
        <div class="alert alert-danger mt-3 small">
            {{ form_field.errors.0 }}
        </div>
    {% endif %}
</div>
