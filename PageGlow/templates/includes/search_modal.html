<!-- Модальное окно поиска -->
<div class="search-modal" id="search-modal" style="display: none;">
    <div class="search-modal-overlay" id="search-modal-overlay"></div>
    <div class="search-modal-container">
        <div class="search-modal-header">
            <div class="search-input-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    class="search-modal-input" 
                    id="search-modal-input"
                    placeholder="Поиск статей, обсуждений, пользователей..." 
                    autocomplete="off"
                >
                <button class="search-clear-btn" id="search-clear-btn" style="display: none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <button class="search-modal-close" id="search-modal-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="search-modal-body">
            <!-- Быстрые результаты -->
            <div class="search-results" id="search-results">
                <div class="search-hint">
                    <p>Начните вводить для поиска...</p>
                    <div class="search-shortcuts">
                        <span class="shortcut-badge">Enter</span>
                        <span>полный поиск</span>
                        <span class="shortcut-badge">Esc</span>
                        <span>закрыть</span>
                    </div>
                </div>
            </div>
            
            <!-- Индикатор загрузки -->
            <div class="search-loading" id="search-loading" style="display: none;">
                <div class="spinner"></div>
                <p>Поиск...</p>
            </div>
        </div>
        
        <div class="search-modal-footer">
            <a href="/search/" class="search-all-link" id="search-all-link" style="display: none;">
                <i class="fas fa-arrow-right"></i>
                Показать все результаты
            </a>
        </div>
    </div>
</div>

<script>
// Глобальные функции для открытия/закрытия модального окна
window.openSearchModal = function() {
    const modal = document.getElementById('search-modal');
    if (modal) {
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
        const input = document.getElementById('search-modal-input');
        if (input) {
            input.focus();
            input.select();
        }
    }
};

window.closeSearchModal = function() {
    const modal = document.getElementById('search-modal');
    if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = '';
        const input = document.getElementById('search-modal-input');
        if (input) input.value = '';
        const results = document.getElementById('search-results');
        if (results) results.innerHTML = '';
        const searchAllLink = document.getElementById('search-all-link');
        if (searchAllLink) searchAllLink.style.display = 'none';
    }
};

// Инициализация после загрузки DOM
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-modal-input');
    const searchResults = document.getElementById('search-results');
    const searchLoading = document.getElementById('search-loading');
    const searchClearBtn = document.getElementById('search-clear-btn');
    const searchAllLink = document.getElementById('search-all-link');
    const searchModalOverlay = document.getElementById('search-modal-overlay');
    const searchModalClose = document.getElementById('search-modal-close');

    let searchTimeout = null;

    // Поиск через AJAX
    function performSearch(query) {
        if (!query.trim()) {
            searchResults.innerHTML = `
                <div class="search-hint">
                    <p>Начните вводить для поиска...</p>
                    <div class="search-shortcuts">
                        <span class="shortcut-badge">Enter</span>
                        <span>полный поиск</span>
                        <span class="shortcut-badge">Esc</span>
                        <span>закрыть</span>
                    </div>
                </div>
            `;
            if (searchAllLink) searchAllLink.style.display = 'none';
            return;
        }

        if (searchLoading) searchLoading.style.display = 'block';
        if (searchResults) searchResults.innerHTML = '';

        fetch(`/search/?q=${encodeURIComponent(query)}&ajax=1`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                if (searchLoading) searchLoading.style.display = 'none';

                if (data.posts && data.posts.length > 0) {
                    let html = '<div class="search-results-list">';
                    data.posts.forEach(post => {
                        html += `
                            <a href="${post.url}" class="search-result-item">
                                <div class="search-result-content">
                                    <h4 class="search-result-title">${highlightMatch(post.title, query)}</h4>
                                    <p class="search-result-excerpt">${highlightMatch(post.excerpt, query)}</p>
                                    <div class="search-result-meta">
                                        <span class="search-result-category"><i class="fas fa-folder"></i> ${post.category}</span>
                                        <span class="search-result-date"><i class="fas fa-clock"></i> ${post.date}</span>
                                        <span class="search-result-views"><i class="fas fa-eye"></i> ${post.views}</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    });
                    html += '</div>';
                    searchResults.innerHTML = html;
                    if (searchAllLink) {
                        searchAllLink.style.display = 'block';
                        searchAllLink.href = `/search/?q=${encodeURIComponent(query)}`;
                    }
                } else {
                    searchResults.innerHTML = `
                        <div class="search-no-results">
                            <i class="fas fa-search"></i>
                            <p>Ничего не найдено по запросу "${query}"</p>
                            <span>Попробуйте изменить запрос</span>
                        </div>
                    `;
                    if (searchAllLink) searchAllLink.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Search error:', error);
                if (searchLoading) searchLoading.style.display = 'none';
                searchResults.innerHTML = '<div class="search-error">Ошибка поиска. Попробуйте позже.</div>';
            });
    }

    // Подсветка совпадений
    function highlightMatch(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }

    // Обработчики событий
    if (searchInput) {
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.trim();

            // Показываем/скрываем кнопку очистки
            if (searchClearBtn) {
                searchClearBtn.style.display = query ? 'block' : 'none';
            }

            // Debounce для уменьшения количества запросов
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 300);
        });

        // Кнопка очистки
        if (searchClearBtn) {
            searchClearBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchClearBtn.style.display = 'none';
                searchResults.innerHTML = '';
                if (searchAllLink) searchAllLink.style.display = 'none';
                searchInput.focus();
            });
        }
    }

    // Закрытие по клику на overlay
    if (searchModalOverlay) {
        searchModalOverlay.addEventListener('click', closeSearchModal);
    }

    // Закрытие по кнопке X
    if (searchModalClose) {
        searchModalClose.addEventListener('click', closeSearchModal);
    }

    // Закрытие по Esc
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('search-modal');
            if (modal && modal.style.display === 'block') {
                closeSearchModal();
            }
        }

        // Открытие по Ctrl+K или Cmd+K
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            openSearchModal();
        }

        // Переход к полному поиску по Enter
        if (e.key === 'Enter' && searchInput && document.activeElement === searchInput) {
            const query = searchInput.value.trim();
            if (query && searchAllLink && searchAllLink.style.display === 'block') {
                window.location.href = searchAllLink.href;
            }
        }
    });

    // Обработчик для кнопки поиска в хедере
    const searchToggle = document.getElementById('search-toggle');
    if (searchToggle) {
        searchToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            openSearchModal();
        });
    }
});
</script>
