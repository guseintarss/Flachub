{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link type="text/css" href="{% static 'main/css/app.css' %}" rel="stylesheet"/>
    <link type="text/css" href="{% static 'main/css/auth.css' %}" rel="stylesheet"/>
    <script>
        // Автоматическое применение системной темы
        (function() {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="site-header">
    <div class="pg-container header-inner">
        <a class="brand" href="{% url 'home' %}">ФлакХаб</a>
    </div>
</header>

<main class="page">
    <div class="pg-container">

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    </div>
</main>
</body>
</html>
