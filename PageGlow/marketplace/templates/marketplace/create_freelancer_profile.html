{% extends "base_market.html" %}
{% load static %}

{% block title %}Маркетплейс фрилансеров - PageGlow{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center py-4">
        <div class="col-md-8 project-card ">
            <h2 class="mb-4">Создание профиля фрилансера</h2>
            <form method="post" class="needs-validation" enctype="multipart/form-data">
                {% for f in form %}
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ f.id_for_label }}" class="form-label">{{ f.label }}</label>
                    {{ f }}
                </div>
                {% endfor %}
                <button class='btn btn-primary'>Сохранить</button>
</div>
{% endblock %}
