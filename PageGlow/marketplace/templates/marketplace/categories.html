{% extends 'base_market.html' %}

{% block content %}
<div class="container py-5">
    <h1>Категории проектов</h1>
    
    <div class="row">
        {% for category in categories %}
        <div class="col-md-6 col-lg-4 mb-4">
            <a href="{% url 'marketplace:projects_list' %}?category={{ category.value }}" class="card text-decoration-none h-100">
                <div class="card-body text-center">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text text-muted">Просмотреть все проекты в этой категории</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
