<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="1200" height="630" fill="#1c3e7e"/>
  
  <!-- Градиент -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c3e7e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Логотип/Бренд -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">PageGlow</text>
  
  <!-- Подзаголовок -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="32" fill="#e2e8f0" text-anchor="middle">ФлакХаб</text>
  
  <!-- Описание -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e0" text-anchor="middle">Платформа для IT-специалистов</text>
  
  <!-- Декоративные элементы -->
  <circle cx="100" cy="100" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="950" cy="150" r="30" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Иконки -->
  <g transform="translate(520, 480)" fill="white" opacity="0.8">
    <!-- Код иконка -->
    <rect x="0" y="0" width="40" height="40" rx="5" fill="none" stroke="white" stroke-width="3"/>
    <text x="20" y="28" font-family="monospace" font-size="20" text-anchor="middle" fill="white">&lt;/&gt;</text>
  </g>
  
  <g transform="translate(640, 480)" fill="white" opacity="0.8">
    <!-- Документ иконка -->
    <rect x="0" y="0" width="40" height="50" rx="3" fill="none" stroke="white" stroke-width="3"/>
    <line x1="10" y1="15" x2="30" y2="15" stroke="white" stroke-width="2"/>
    <line x1="10" y1="25" x2="30" y2="25" stroke="white" stroke-width="2"/>
    <line x1="10" y1="35" x2="25" y2="35" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- URL сайта -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#a0aec0" text-anchor="middle">pageglow.ru</text>
</svg>
